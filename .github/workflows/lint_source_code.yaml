name: Lint source code

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

permissions:
  contents: read # required for checkout out the repository

jobs:
  lint-source-code:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Lint shell scripts
      uses: bewuethr/shellcheck-action@80bac2daa9fcf95d648200a793d00060857e6dc4 # v2.3.0

    - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        toolchain: stable
        components: clippy

    - name: Run Rust linters and tests
      shell: bash
      working-directory: components
      run: |-
        cargo fmt --all --check
        cargo clippy --workspace --all-features -- -Dwarnings
        cargo test --workspace --all-features
