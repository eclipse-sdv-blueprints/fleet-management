networks:
  fms-backend:
    driver: overlay
    attachable: true
  fms-vehicle:
    driver: overlay
    attachable: true

configs:
  influxdb_init.sh:
    file: "./influxdb/init-scripts/create-fms-token.sh"
  grafana_dashboards_from_fs.yaml:
    file: "./grafana/provisioning/dashboards/dashboards_from_filesystem.yaml"
  grafana_fms_dashboard.json:
    file: "./grafana/dashboards/FMS-Fleet.json"
  vss_overlay.json:
    file: "./databroker/vss.json"

volumes:
  influxdb-data:
  influxdb-config:
  influxdb-auth:
  grafana-datasources:

services:
  dozzle: # https://dozzle.dev/guide/what-is-dozzle
    image: amir20/dozzle:latest
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    ports:
      - "127.0.0.1:8080:8080"

  influxdb:
    image: "docker.io/library/influxdb:2.7"
    healthcheck:
      test: ["CMD-SHELL", "influx ping"]
      interval: 5s
      timeout: 3s
      start_period: 5s
    cap_drop: &default-drops
      - CAP_MKNOD
      - CAP_NET_RAW
      - CAP_AUDIT_WRITE
    command: influxd
    env_file: "./influxdb/fms-demo.env"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: "setup"
      DOCKER_INFLUXDB_INIT_USERNAME: "fms-demo"
      DOCKER_INFLUXDB_INIT_PASSWORD: "fms-demo-secret"
      DOCKER_INFLUXDB_INIT_RETENTION: "1w"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "fms-backend-admin-token"
    networks:
      - "fms-backend"
    ports:
      - "${FMS_INFLUXDB_BIND_HOST:-127.0.0.1}:8086:8086"
    configs:
      - source: "influxdb_init.sh"
        target: "/docker-entrypoint-initdb.d/influxdb_init.sh"
    volumes:
      - type: "volume"
        source: "influxdb-data"
        target: "/var/lib/influxdb2"
      - type: "volume"
        source: "influxdb-config"
        target: "/etc/influxdb2"
      - type: "volume"
        source: "influxdb-auth"
        target: "/tmp/out"
      - type: "volume"
        source: "grafana-datasources"
        target: "/tmp/influxdb-datasources"

  grafana:
    image: "docker.io/grafana/grafana:9.5.14"
    cap_drop: *default-drops
    ports:
      - "${FMS_GRAFANA_BIND_HOST:-127.0.0.1}:3000:3000"
    networks:
      - "fms-backend"
    depends_on:
      influxdb:
        condition: service_healthy
    configs:
      - source: "grafana_dashboards_from_fs.yaml"
        target: "/etc/grafana/provisioning/dashboards/grafana_dashboards_from_fs.yaml"
      - source: "grafana_fms_dashboard.json"
        target: "/etc/dashboards/grafana_fms_dashboard.json"
        mode: 0644
    volumes:
      - type: "volume"
        source: "grafana-datasources"
        target: "/etc/grafana/provisioning/datasources"
        read_only: true
    environment:
      - GF_SECURITY_ADMIN_USER=sdv
      - GF_SECURITY_ADMIN_PASSWORD=sdv
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=500ms

  fms-server:
    image: "ghcr.io/eclipse-sdv-blueprints/fleet-management/fms-server:main"
    build:
      context: "./components"
      dockerfile: "./fms-server/Dockerfile"
    cap_drop: *default-drops
    networks:
      - "fms-backend"
    ports:
      - "${FMS_SERVER_BIND_HOST:-127.0.0.1}:8081:8081"
    depends_on:
      influxdb:
        condition: service_healthy
    env_file: "./influxdb/fms-demo.env"
    environment:
      INFLUXDB_TOKEN_FILE: "/tmp/fms-demo.token"
      RUST_LOG: "info"
    volumes:
      - type: "volume"
        source: "influxdb-auth"
        target: "/tmp"
        read_only: true

  fms-consumer:
    image: "ghcr.io/eclipse-sdv-blueprints/fleet-management/fms-consumer:main"
    build:
      context: "./components"
      dockerfile: "./fms-consumer/Dockerfile"
    cap_drop: *default-drops
    networks:
      - "fms-backend"
    depends_on:
      influxdb:
        condition: service_healthy
    env_file:
      - "./influxdb/fms-demo.env"
    environment:
      INFLUXDB_TOKEN_FILE: "/tmp/fms-demo.token"
      RUST_LOG: "${FMS_CONSUMER_LOG_CONFIG:-info,fms_consumer=debug,influx_client=debug}"
    volumes:
      - type: "volume"
        source: "influxdb-auth"
        target: "/tmp"
        read_only: true

  databroker:
    image: "ghcr.io/eclipse-kuksa/kuksa-databroker:0.7.1"
    cap_drop: *default-drops
    networks:
      - "fms-vehicle"
    ports:
      - "${FMS_DATABROKER_BIND_HOST:-127.0.0.1}:55555:55556"
    configs:
      - "vss_overlay.json"
    environment:
      KUKSA_DATABROKER_ADDR: "0.0.0.0"
      KUKSA_DATABROKER_PORT: "55556"
      KUKSA_DATABROKER_METADATA_FILE: "/vss_overlay.json"
      RUST_LOG: "info"
    # for the time being, we do not use TLS secured connections to Databroker
    command: "--insecure"

  wait-for-databroker:
    image: drevops/docker-wait-for-dependencies:26.10.0
    networks:
      - "fms-vehicle"
    depends_on:
      - databroker
    environment:
      SLEEP_LENGTH: "1"
      TIMEOUT_LENGTH: "60"
    command: "databroker:55556"
    restart: "no"

  csv-provider:
    image: "ghcr.io/eclipse-kuksa/kuksa-csv-provider/csv-provider:0.4.6"
    cap_drop: *default-drops
    networks:
      - "fms-vehicle"
    depends_on:
      wait-for-databroker:
        condition: service_completed_successfully
    volumes:
      - "./csv-provider/truck1_signals.csv:/dist/signals.csv"
    environment:
      PROVIDER_INFINITE: 1
      PROVIDER_LOG_LEVEL: "INFO"
      KUKSA_DATA_BROKER_ADDR: "databroker"
      KUKSA_DATA_BROKER_PORT: "55556"

  fms-forwarder:
    image: "ghcr.io/eclipse-sdv-blueprints/fleet-management/fms-forwarder:main"
    build:
      context: "./components"
      dockerfile: "./fms-forwarder/Dockerfile"
    cap_drop: *default-drops
    networks:
      - "fms-backend"
      - "fms-vehicle"
    depends_on:
      # allow the CSV provider to publish the VIN to the Databroker
      csv-provider:
        condition: service_started
    environment:
      KUKSA_DATABROKER_URI: "http://databroker:55556"
      TIMER_INTERVAL: "${FMS_FORWARDER_TIMER_INTERVAL:-2000ms}"
      RUST_LOG: "${FMS_FORWARDER_LOG_CONFIG:-info,fms_forwarder=info}"
      TRUST_STORE_PATH: "${FMS_FORWARDER_TRUST_STORE_PATH:-/etc/ssl/certs/ca-certificates.crt}"

  fleet-analysis-backend:
    build:
      context: "./components/backend-fleet-analysis-java"
      dockerfile: "Dockerfile"
    cap_drop: *default-drops
    networks:
      - "fms-backend"
    depends_on:
      influxdb:
        condition: service_healthy
    env_file: "./influxdb/fms-demo.env"
    environment:
      INFLUXDB_TOKEN_FILE: "/tmp/fms-demo.token"
      INFLUXDB_STATS_INTERVAL_SECONDS: "${INFLUXDB_STATS_INTERVAL_SECONDS:-30}"
    ports:
      - "${FMS_FLEET_ANALYSIS_BIND_HOST:-127.0.0.1}:8082:8080"
    volumes:
      - type: "volume"
        source: "influxdb-auth"
        target: "/tmp"

